<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Review moderation — AV Toys</title>
<meta name="theme-color" content="#08080a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23e11212'/%3E%3Ctext x='50' y='70' font-size='52' font-family='Arial,sans-serif' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EAV%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/css/styles.css?v=3" />
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<header class="site-header is-stuck" style="position:static">
  <div class="shell site-header__inner">
    <a href="index.html" class="brand" aria-label="AV Toys home">
      <img src="assets/img/av-toys-logo.png" alt="AV Toys" width="1400" height="993" />
    </a>
    <button class="btn btn--sm btn--ghost" id="logout" hidden>Sign out</button>
  </div>
</header>

<main class="shell" style="padding-top:40px;padding-bottom:80px;max-width:1100px">

  <p class="eyebrow">Internal</p>
  <h1 class="section__title" style="margin:10px 0 8px">Review moderation</h1>
  <p style="color:var(--muted);margin-bottom:32px">Approve or reject customer reviews. Approved reviews appear on the site immediately.</p>

  <!-- Login -->
  <form class="cform" id="loginForm" style="max-width:420px">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" autocomplete="username" required />
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit" class="btn btn--red btn--wide">Sign in</button>
    <p class="cform__note" id="loginNote"></p>
  </form>

  <!-- App -->
  <div id="app" hidden>
    <div class="admin-tabs" id="tabs">
      <button class="admin-tab is-active" data-status="pending">Pending</button>
      <button class="admin-tab" data-status="approved">Approved</button>
      <button class="admin-tab" data-status="rejected">Rejected</button>
      <button class="admin-tab admin-tab--refresh" id="refresh" title="Reload">↻</button>
    </div>
    <p id="adminNote" style="color:var(--muted);margin:16px 0"></p>
    <div id="adminList" class="admin-list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/admin.js?v=1"></script>
</body>
</html>
