<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Track store receipts, filter by date range and see which areas spend the most.">
<title>{% block title %}SSK Receipt Tracker{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<script>
  // Apply the stored theme before first paint so the page never flashes light.
  try {
    var t = localStorage.getItem('ssk-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode - fall back to the OS preference */ }
</script>
</head>
<body>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
