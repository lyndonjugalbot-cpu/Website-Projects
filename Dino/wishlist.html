<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist — DinoMart</title>
  <meta name="description" content="Your saved figures, boosters and shwag at DinoMart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow">The grail list</span>
        <h1>Your wishlist</h1>
        <p>Saved for later, synced to this device. <span data-wish-count></span></p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="wrap">
        <div style="margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap" data-wish-actions hidden>
          <button class="btn btn--fire btn--sm" data-add-all>Add all in-stock to cart</button>
          <button class="btn btn--ghost btn--sm" data-clear-wish>Clear wishlist</button>
        </div>
        <div class="product-grid" data-wishlist></div>
        <div data-wish-empty hidden class="empty">
          <div class="glyph">🖤</div>
          <h3>No grails saved yet</h3>
          <p>Tap the heart on any product to stash it here for later.</p>
          <a class="btn btn--jungle btn--sm" href="shop.html">Browse the shop</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script src="js/wishlist.js?v=2"></script>
</body>
</html>
